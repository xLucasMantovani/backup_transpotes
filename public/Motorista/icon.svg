<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cana Control">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16283a"/>
      <stop offset="1" stop-color="#0e1a26"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g fill="none" stroke="#2e86c1" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- carroceria -->
    <rect x="120" y="200" width="200" height="120" rx="10" fill="#1c3145"/>
    <!-- cabine -->
    <path d="M320 230 h80 l40 60 v30 h-120 z" fill="#1c3145"/>
    <!-- rodas -->
    <circle cx="180" cy="340" r="26" fill="#0e1a26"/>
    <circle cx="370" cy="340" r="26" fill="#0e1a26"/>
  </g>
  <!-- detalhe -->
  <path d="M150 240 h140" stroke="#27ae60" stroke-width="14" stroke-linecap="round"/>
