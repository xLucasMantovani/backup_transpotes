Este documento descreve todas as funcionalidades, regras de negócio, validações, estruturas de dados e fluxos do aplicativo **Ivan Transportes – App do Motorista (v7.4)**. O objetivo é fornecer uma base completa para a implementação das integrações de entrada e saída com uma plataforma backend (API, banco de dados, etc.).

---

## 1. Visão Geral

O aplicativo é um **PWA (Progressive Web App)** desenvolvido para motoristas de transporte de cana-de-açúcar. Ele permite:

- Login com PIN de 4 dígitos.
- Registro de viagens de produção (cana).
- Checklist de inspeção pré-viagem (itens mecânicos e não mecânicos).
- Registro de ocorrências (incidentes, problemas).
- Registro de abastecimento (combustível).
- Histórico completo de todas as ações.
- Controle de turno (diurno/noturno) com logout automático.
- Troca de motorista no mesmo veículo.
- Alteração de veículo (com senha master).
- Alertas de validação (peso fora da faixa, inconsistência de KM/consumo, etc.).
- Geração automática de OS (Ordens de Serviço) para itens mecânicos não conformes.
- Bloqueio do veículo em casos críticos.

---

## 3. Funcionalidades e Regras de Negócio

### 3.1. Login

- O motorista seleciona seu nome em uma lista (filtrada pelos veículos que ele pode operar).
- Informa um **PIN de 4 dígitos** (primeiros 4 dígitos do CPF).
- **Regras**:
  - 3 tentativas incorretas → bloqueio de 60 segundos.
  - Ao logar, a sessão é criada com:
    - \`driverId\`, \`vehicleId\` (fixo do dispositivo).
    - Turno calculado com base no centro de custo e hora atual.
  - O login dispara verificações:
    - Ocorrências abertas no veículo → modal de alerta.
    - Bloqueio do veículo (se houver ocorrência crítica não reconhecida ou checklist reprovado crítico).

### 3.2. Turno e Logout Automático

- O turno é calculado a partir do centro de custo e da hora atual.
- São gerados **avisos** 15 e 5 minutos antes do fim do turno.
- Ao atingir o horário de fim do turno, o app realiza **logout automático**.
- Todos os registros em andamento são salvos com status "Pendente" ou "Aguardando análise".

### 3.3. Troca de Motorista

- Acessível clicando no nome do veículo no topo.
- Exige **PIN do novo motorista** (4 dígitos).
- Ao trocar:
  - O checklist é resetado.
  - O reconhecimento de ocorrências é resetado (\`occAckThisSession = false\`).
  - O turno é recalculado.
  - As ocorrências abertas são exibidas novamente.

### 3.4. Alteração de Veículo (Admin)

- Acessível via menu Configurações → "Alterar Veículo (Admin)".
- Exige a **Senha Master** (\`MASTER2026\`).
- Regras:
  - 3 tentativas incorretas → bloqueio de 2 minutos.
  - Após validar, seleciona novo veículo e informa motivo.
  - A alteração gera evento de auditoria e força logout.

### 3.5. Checklist de Inspeção Pré-Viagem

- Lista de 10 itens (5 mecânicos, 5 não mecânicos).
- Cada item pode ser marcado como **Conforme** ou **Não Conforme**.
- Itens não conformes exigem:
  - **Gravidade** (Baixa, Média, Alta, Crítica).
  - **Descrição** do problema.
- **Regras**:
  - Todos os itens devem ser respondidos para concluir.
  - Itens mecânicos não conformes → geração de **OS para o mecânico**.
  - Itens com gravidade **Alta ou Crítica** → **bloqueio do veículo**.
  - O checklist é registrado no histórico.
  - Fotos podem ser anexadas (armazenamento local não implementado, apenas simbólico).

### 3.6. Registro de Viagem (Produção)

- Campos obrigatórios:
  - Data (preenchida automaticamente).
  - Nº Viagem (opcional).
  - Ticket/Romaneio (opcional).
  - Usina de destino (seleção).
  - **Peso Líquido (t)** – obrigatório.
- Campos opcionais:
  - Fazenda, Talhão, Peso Bruto, Tara, Distância, Hora Saída, Hora Chegada, Observações.
- **Cálculo automático**: ao preencher Bruto e Tara, o Peso Líquido é calculado (Bruto – Tara).
- **Regras de validação**:
  - **Peso líquido > 0**.
  - Se o peso for ≥ 1000 (unidade suspeita: kg → t), o app exibe alerta perguntando se deseja converter para toneladas (dividir por 1000).
  - Se o peso estiver **fora da faixa** \`capMin\`–\`capMax\` do veículo, exibe alerta de inconsistência.
  - Em ambos os casos, o usuário pode:
    - Corrigir manualmente.
    - Informar uma justificativa (obrigatória) e confirmar o registro (o registro fica com status "Aguardando análise" e um alerta é gerado).
    - Cancelar.
- Fotos podem ser anexadas (simbólico).

### 3.7. Registro de Ocorrência

- Campos obrigatórios:
  - **Motivo** (lista pré-definida + "Outro").
  - **Gravidade** (Baixa, Média, Alta, Crítica).
- Campo opcional: Descrição, Local.
- **Regras**:
  - Ocorrências com motivo mecânico (mapeamento interno) geram **OS para o mecânico**.
  - Todas as ocorrências geram **alerta** no histórico.
  - Ocorrências abertas são exibidas no login e no banner.
  - Fotos podem ser anexadas (simbólico).

### 3.8. Registro de Abastecimento

- Campos obrigatórios:
  - Data (preenchida automaticamente).
  - Hora (preenchida automaticamente).
  - **KM Atual** (inteiro).
  - Litros.
  - Combustível (Diesel, Gasolina, Etanol).
  - Posto (seleção de lista ou "Outro posto" com nome, cidade e justificativa).
- Campos opcionais: Valor Total, Preço/litro, Nº do cupom/nota, Observações.
- **Regras**:
  - O KM atual deve ser **maior que o último KM registrado** para o veículo (armazenado em \`ultimoKmVeiculo\`).
  - Se não for, alerta de inconsistência (exige correção, foto do odômetro ou justificativa).
  - O consumo é calculado: \`(KM_novo - KM_anterior) / Litros\`.
  - Se o consumo estiver **fora da faixa esperada** (2.0 a 4.5 km/l), alerta de inconsistência.
  - Em ambos os casos, o usuário pode corrigir, tirar foto, justificar ou confirmar mesmo assim (gera alerta e OS para o mecânico).
  - Fotos do odômetro e do comprovante podem ser anexadas.

### 3.9. Histórico

- Exibe todos os registros (histórico) com filtros por **tipo** e **motorista**.
- Ao clicar em um item, exibe detalhes em modal.

### 3.10. Alertas e OS (Ordens de Serviço)

- **Alertas** são registros do tipo "Alertas" no histórico, usados para notificar o gestor sobre:
  - Peso fora da faixa.
  - Checklist não conforme.
  - Ocorrência registrada.
  - Inconsistência de KM/consumo.
- **OS** são geradas automaticamente para:
  - Itens mecânicos não conformes no checklist.
  - Ocorrências com motivo mecânico.
  - Inconsistências de KM/consumo (para verificação mecânica).
- As OS ficam com status "Aberta" e são listadas na tela inicial.

### 3.11. Bloqueio do Veículo

- O veículo é bloqueado quando:
  - Ocorrências não reconhecidas geram bloqueio se o motorista recusar operar.
  - O checklist tem itens com gravidade **Alta ou Crítica**.
- Quando bloqueado, o banner exibe aviso e **ações de produção, checklist, ocorrências e abastecimento são restritas** (exibe toast de bloqueio).

### 3.12. Banner de Aviso

- Exibe avisos sobre:
  - Ocorrências abertas não reconhecidas (toque para revisar).
  - Registros pendentes de sincronização (status "Pendente" ou "Aguardando análise").
  - Veículo bloqueado.

### 3.13. GPS Simulado

- Apenas simula atualização de localização a cada 30s, sem envio real.

### 3.14. Configurações

- Acesso a:
  - Alterar Veículo (Admin).
  - Ver Auditoria (lista de eventos).
  - Alternar tema claro/escuro.
  - Sair (logout manual).
  - (QA) Forçar fim de turno.

### 3.15. Persistência (localStorage)

- Os seguintes dados são salvos no \`localStorage\` do navegador:
  - \`ivan_history\`: histórico completo.
  - \`ivan_os\`: ordens de serviço.
  - \`ivan_audit\`: log de auditoria.
  - \`ivan_occ\`: ocorrências por veículo.
  - \`ivan_ultimoKm\`: último KM registrado por veículo.
  - \`ivan_theme\`: tema selecionado.

## 4. Fluxos de Entrada/Saída para Integração com Plataforma

Para implementar a comunicação com um backend, considere os seguintes pontos:

### 4.1. Dados que DEVEM ser enviados ao backend (saída)

- **Sessão/Login**: autenticação do motorista (validar PIN contra base).
- **Viagem de Produção**:
  - Todos os campos (data, número, ticket, usina, peso líquido, fazenda, talhão, bruto, tara, distância, horas, observações).
  - Indicador de irregularidade (se houve alerta) e justificativa.
- **Checklist**:
  - Respostas de cada item (conforme/não conforme).
  - Para não conformes: gravidade, descrição.
  - Observações gerais.
  - Fotos (base64 ou URL).
- **Ocorrência**:
  - Motivo, descrição, local, gravidade.
  - Fotos.
- **Abastecimento**:
  - Data, hora, KM atual, litros, combustível, posto (ou nome/cidade), valor, preço/litro, cupom, observações.
  - Indicador de irregularidade e justificativa.
  - Fotos do odômetro e comprovante.
- **Ordens de Serviço (OS)**:
  - Motivo, origem, gravidade, veículo, motorista, data.
- **Alertas**:
  - Título, status, detalhes (incluindo justificativa).
- **Auditoria**:
  - Todos os eventos de ação (login, logout, troca de motorista, alteração de veículo, etc.).

### 4.2. Dados que DEVEM ser recebidos do backend (entrada)

- **Lista de motoristas** (com CPF, veículos permitidos).
- **Lista de veículos** (placa, centro de custo, capacidade mín/máx).
- **Centros de custo** (nome, se produz cana, horários de turno).
- **Checklist** (itens e se são mecânicos) – atualmente fixo.
- **Motivos de ocorrência** e classificação mecânica.
- **Postos de combustível** (ativos).
- **Configurações de consumo** (min/max km/l).
- **Senha Master** (para alteração de veículo).

### 4.3. Estratégia de Sincronização

- O app mantém registros com status:
  - **Sincronizado**: já enviado e confirmado pelo backend.
  - **Pendente**: aguardando envio (por exemplo, fim de turno).
  - **Aguardando análise**: enviado, mas com irregularidade que requer aprovação.
- Na integração, recomenda-se:
  1. Ao criar um registro, enviar imediatamente ao backend (síncrono ou assíncrono).
  2. Atualizar o status para "Sincronizado" após confirmação do backend.
  3. Em caso de falha de rede, manter como "Pendente" e tentar novamente.
  4. O backend pode retornar um ID único para referência.

### 4.4. Considerações de API (sugestões de endpoints)

- \`POST /api/login\` – validar motorista e PIN, retornar dados da sessão.
- \`POST /api/viagem\` – registrar viagem.
- \`POST /api/checklist\` – registrar checklist.
- \`POST /api/ocorrencia\` – registrar ocorrência.
- \`POST /api/abastecimento\` – registrar abastecimento.
- \`POST /api/os\` – criar OS (pode ser disparado pelo backend automaticamente).
- \`POST /api/alerta\` – registrar alerta.
- \`GET /api/historico\` – sincronizar histórico local com o backend (pull).
- \`GET /api/configuracoes\` – obter lista de motoristas, veículos, postos, etc.
- \`POST /api/auditoria\` – enviar log de auditoria.

## 5. Validações e Regras Críticas

| Funcionalidade | Regra | Ação em caso de violação |
|----------------|-------|--------------------------|
| Login | PIN incorreto 3x | Bloqueio de 60s |
| Viagem | Peso líquido ≤ 0 | Impede registro |
| Viagem | Peso ≥ 1000 | Alerta para converter kg→t |
| Viagem | Peso fora da faixa do veículo | Alerta com opção de justificar |
| Checklist | Itens não respondidos | Impede conclusão |
| Checklist | Item não conforme + gravidade Alta/Crítica | Bloqueia veículo |
| Checklist | Item não conforme mecânico | Gera OS |
| Ocorrência | Motivo mecânico | Gera OS |
| Abastecimento | KM atual < último KM | Alerta com opções (corrigir, foto, justificar) |
| Abastecimento | Consumo fora da faixa (2.0–4.5 km/l) | Alerta com opções (corrigir, foto, justificar) e gera OS |
| Troca de Motorista | PIN incorreto 3x | Bloqueio de 60s para o motorista |
| Alteração de Veículo | Senha Master incorreta 3x | Bloqueio de 2 minutos |

---

## 6. Mapeamento de Status

- **Sincronizado**: registro finalizado e aceito pelo backend.
- **Pendente**: registro aguardando envio (offline).
- **Aguardando análise**: registro enviado, mas com alguma inconsistência que requer aprovação manual.
- **Bloqueado**: veículo impedido de operar até desbloqueio (manual).
- **Aberta**: OS ou ocorrência em aberto.

## 8. Considerações para Implementação

- O app usa **localStorage** para persistência local. No backend, os dados devem ser armazenados em um banco de dados relacional ou NoSQL.
- As **fotos** são anexadas via input file, mas não são enviadas para lugar nenhum (apenas simbólico). Na integração real, devem ser convertidas para base64 ou enviadas como multipart/form-data.
- O app **não possui autenticação via token JWT ou similar** – apenas PIN local. Recomenda-se implementar um sistema de token para comunicação com a API.
- O **turno** é calculado no frontend; o backend pode validar o horário ao receber registros.
- A **auditoria** pode ser enviada em lote para otimização.

// ========== FUNÇÃO PARA CONVERTER MARKDOWN PARA HTML (BÁSICO) ==========
function markdownToHtml(md) {
    // Escapa HTML especial
    let html = md;

    // Títulos (##, ###, ####)
    html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
    html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
    html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');

    // Negrito e itálico
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');

    // Código inline
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Blocos de código (``` ... ```)
    html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, function(match, lang, code) {
        return '<pre><code>' + code.trim() + '</code></pre>';
    });

    // Linhas horizontais
    html = html.replace(/^---$/gim, '<hr>');

    // Listas não ordenadas (- item)
    html = html.replace(/^- (.*$)/gim, '<li>$1</li>');
    // Agrupa listas
    html = html.replace(/(<li>.*<\/li>\n?)+/g, function(match) {
        return '<ul>' + match + '</ul>';
    });

    // Parágrafos (linhas em branco separam)
    html = html.replace(/\n\n/g, '</p><p>');
    html = '<p>' + html + '</p>';

    // Remove parágrafos vazios ou com apenas espaços
    html = html.replace(/<p>\s*<\/p>/g, '');

    // Tabelas (simplificado - só para a tabela de validações)
    // Tabela simples com | --- | --- |
    html = html.replace(/\|(.+)\|/g, function(match, row) {
        const cells = row.split('|').map(c => c.trim());
        if (cells.some(c => c.includes('---'))) return ''; // ignora linha de separação
        return '<tr>' + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>';
    });
    // Envolve as linhas da tabela em <table><tbody>...</tbody></table>
    html = html.replace(/(<tr>.*<\/tr>\s*)+/g, function(match) {
        return '<table><tbody>' + match + '</tbody></table>';
    });

    // Quebras de linha dentro de parágrafos (substitui \n por <br>)
    html = html.replace(/\n/g, '<br>');

    return html;
}

// ========== RENDERIZAR ==========
document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('readmeContent');
    container.innerHTML = markdownToHtml(markdownContent);

    // Botão de download do README.md
    document.getElementById('downloadBtn').addEventListener('click', function() {
        const blob = new Blob([markdownContent], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'README-IVAN-TRANSPORTES.md';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    });
});
</script>
